# /etc/nginx/sites-available/metromitra.com
# METRO MITRA — Production Web Server Configuration

server {
    listen 80;
    listen [::]:80;
    server_name metromitra.com www.metromitra.com;
    return 301 https://metromitra.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.metromitra.com;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/metromitra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metromitra.com/privkey.pem;

    # Redirect www to non-www canonical
    return 301 https://metromitra.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name metromitra.com;

    root /var/www/workforce_web/dist;
    index index.html;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/metromitra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metromitra.com/privkey.pem;

    # SSL Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # CRITICAL SEO FIX FOR 2,333 "PAGE WITH REDIRECT" & 1,561 CANONICAL ERRORS:
    # 
    # Nginx by default redirects requests for directory paths without trailing
    # slashes (e.g., /services/electrician/kolkata -> 301 /services/electrician/kolkata/).
    # By checking $uri/index.html directly before $uri/, Nginx serves the static
    # prerendered page immediately WITHOUT issuing a 301 redirect.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    # Static Assets Caching (1 year)
    location ~* \.(?:css|js|woff2?|svg|png|jpe?g|webp|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # XML Sitemaps and Robots.txt (Direct serving, no cache)
    location ~* ^/(sitemap.*\.xml|robots\.txt)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Real 404 Handler
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
